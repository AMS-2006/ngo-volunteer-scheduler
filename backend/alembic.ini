# Alembic Configuration File
# Docs: https://alembic.sqlalchemy.org/

[alembic]
# Path to the migration scripts folder (relative to this file)
script_location = alembic

# Override with env var DATABASE_URL at runtime or set directly here
# For team members: copy .env.example → .env and update DATABASE_URL
sqlalchemy.url = postgresql+psycopg2://postgres:password@localhost:5432/ngo_volunteer_db

[post_write_hooks]
# Optional: format generated migration files with black
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
